services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:20.0
    ports:
      - "127.0.0.1:5000:80"
    restart: unless-stopped
    command: 
      - start
      - --import-realm
    healthcheck:
      test: ["CMD", "curl", "-k", "https://rk-keycloak.visibility.nccoe.org/health"]
      interval: 5s
      timeout: 2s
      retries: 15
    environment:
      KC_DB: mariadb
      KC_DB_URL: "jdbc:mariadb://rk-mariadb.visibility.nccoe.org/keycloak_corp?useSsl=true&serverSslCert=/certs/rk-mariadb.crt.pem&enabledSslProtocolSuites=TLSv1.3"
      KC_DB_PASSWORD: ${TLSV_LAB_PASSWORD}
      KC_DB_USERNAME: 'keycloak-corp-db-user'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_PORT: 80
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY: edge
    volumes:
      - $PWD/certs:/certs
