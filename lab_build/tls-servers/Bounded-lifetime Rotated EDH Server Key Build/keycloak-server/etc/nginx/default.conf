server {
  listen 80;
  server_name rk-keycloak.visibility.nccoe.org;
  return 301 https://rk-keycloak.visibility.nccoe.org$request_uri;
}

server {
  listen 443 ssl;
  server_name rk-keycloak.visibility.nccoe.org;
  ssl_certificate /home/administrator/certs/rk-keycloak.crt.pem;
  ssl_certificate_key /home/administrator/certs/rk-keycloak.key.pem;
  ssl_prefer_server_ciphers on;
  ssl_protocols TLSv1.3;

  location / {
    proxy_pass http://localhost:5000;

    proxy_set_header	Host $host;
    proxy_set_header	X-Real-IP $remote_addr;
    proxy_set_header	X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header	X-Forwarded-Proto $scheme;
 
    proxy_buffer_size   128k;
    proxy_buffers   4 256k;
    proxy_busy_buffers_size   256k;
  }
}
