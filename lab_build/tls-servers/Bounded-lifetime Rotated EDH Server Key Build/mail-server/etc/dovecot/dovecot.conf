disable_plaintext_auth = no
mail_privileged_group = mail
mail_location = mbox:~/mail:INBOX=/var/mail/%u
userdb {
  driver = passwd
}
passdb {
  args = %s
  driver = pam
}
protocols = imap
mail_debug = yes
ssl=yes
ssl_cert=</home/tlsadmin/rk_mail.crt.pem
ssl_key=</home/tlsadmin/rk_mail.key.pem
ssl_dh=</usr/share/dovecot/dh.pem
ssl_min_protocol = TLSv1.2
