
zone {
    name = "zone-1"
    auth_group = eva-zone-1

    key_reporting {
        consumer = "eva://mira-eto-passive.visibility.nccoe.org:22222?ca-cert=/certs/DigiCertCAChain.crt.pem"
        consumer = "resp+nccoe://redis.visibility.nccoe.org"
    }

    manager {
        user = eva-zone-1

        log {
            device = "syslog://?facility=local5&levels=key-rprt:>=debug&annotate=topic,level,align"
        }
    }

    agent {
        log {
            device = "syslog://?facility=local5&levels=key-rprt:>=debug&annotate=topic,level,align"
        }
    }
}
