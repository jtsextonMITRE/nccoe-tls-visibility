server { 
  listen 80; 
  server_name ek-testapp.visibility.nccoe.org;
  return 301 https://ek-testapp.visibility.nccoe.org$request_uri;
}

server {
  listen 443 ssl;
  server_name ek-testapp.visibility.nccoe.org;
  ssl_certificate /certs/ek-testapp.crt.pem;
  ssl_certificate_key /certs/ek-testapp.key.pem;
  ssl_prefer_server_ciphers on;
  ssl_protocols TLSv1.3;

  large_client_header_buffers 4 16k;

  location / { 
    proxy_ssl_protocols TLSv1.3;
    proxy_pass https://ek-testapp-1.visibility.nccoe.org;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
  }
}
