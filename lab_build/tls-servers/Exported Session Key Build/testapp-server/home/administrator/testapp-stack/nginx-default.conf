server { 
  listen 80; 
  server_name ek-testapp-1.visibility.nccoe.org;
  return 301 https://ek-testapp.visibility.nccoe.org$request_uri;
}

server {
  listen 443 ssl;
  server_name ek-testapp-1.visibility.nccoe.org;
  ssl_certificate /certs/ek-testapp-1.crt.pem; 
  ssl_certificate_key /certs/ek-testapp-1.key.pem;
  ssl_prefer_server_ciphers on;
  ssl_protocols TLSv1.3;

  large_client_header_buffers 4 16k;

  location / {
    proxy_pass http://testapp:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
  }
  
  location /GtHODfM/qilZw/YjtK\.php {
    add_header Content-Type text/html;
    add_header X-Powered-By: PHP/8.0.12;
    add_header Server: Apache/2.4.51 (Win64) OpenSSL/1.1.1l PHP/8.0.12;
    return 200 '<<sanitized payload>>';
  }

  location /payload\.php {
    add_header Content-Type text/html;
    root /app/;
  }

}


