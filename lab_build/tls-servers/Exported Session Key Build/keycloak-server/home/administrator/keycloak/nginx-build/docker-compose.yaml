version: '3.1'

services:
  nginx:
    depends_on:
      - keycloak
    container_name: nginx_reverse_proxy
    build: ./nginx-build
    ulimits:
      memlock: 67108864
    restart: unless-stopped
    entrypoint: /tmp/entrypoint.sh
    volumes:
      - $PWD/certs:/certs:ro
      - $PWD/default.conf:/etc/nginx/sites-enabled/default.conf
      - ./nginx-build/nfr/conf/:/etc/eva/
      - ./nginx-build/nfr/syslog-eva.conf:/etc/syslog-ng/conf.d/eva.conf
      - ./nginx-build/nfr/openssl.cnf:/etc/ssl/openssl.cnf
    ports:
      - 443:443
      - 80:80

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:20.0
    restart: unless-stopped
    command: 
      - start
      - --import-realm
    healthcheck:
      test: ["CMD", "curl", "-k", "https://ek-keycloak.visibility.nccoe.org/health"]
      interval: 5s
      timeout: 2s
      retries: 15
    environment:
      KC_DB: mariadb
      KC_DB_URL: "jdbc:mariadb://ek-mariadb.visibility.nccoe.org/keycloak_corp?useSsl=true&serverSslCert=/certs/ek-mariadb.crt.pem&enabledSslProtocolSuites=TLSv1.3"
      KC_DB_PASSWORD: ${TLSV_LAB_PASSWORD}
      KC_DB_USERNAME: 'keycloak-corp-db-user'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_PORT: 80
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY: edge
    volumes:
      - $PWD/certs:/certs
